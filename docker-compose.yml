services:
  nexusit-db:
    image: postgres:16
    container_name: nexusit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nexusit}
      POSTGRES_USER: ${DB_USER:-nexusit}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /opt/data/nexusit/postgres:/var/lib/postgresql/data
    networks:
      - nexusit-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nexusit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nexusit-backend:
    build: ./backend
    container_name: nexusit-backend
    restart: unless-stopped
    depends_on:
      nexusit-db:
        condition: service_healthy
    environment:
      DB_HOST: nexusit-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-nexusit}
      DB_USER: ${DB_USER:-nexusit}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-28800000}
      ZABBIX_API_URL: ${ZABBIX_API_URL}
      ZABBIX_USER: ${ZABBIX_USER:-Admin}
      ZABBIX_PASSWORD: ${ZABBIX_PASSWORD}
      GLPI_API_URL: ${GLPI_API_URL}
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN:-}
      GLPI_USER_TOKEN: ${GLPI_USER_TOKEN:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://nexus.local}
      APP_COMPANY_NAME: ${APP_COMPANY_NAME:-Armazém Galdino}
      APP_SUPPORT_PHONE: ${APP_SUPPORT_PHONE:-}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY}
      VAULTWARDEN_BASE_URL: ${VAULTWARDEN_BASE_URL:-}
      VAULTWARDEN_EMAIL: ${VAULTWARDEN_EMAIL:-}
      VAULTWARDEN_MASTER_PASSWORD: ${VAULTWARDEN_MASTER_PASSWORD:-}
      VAULTWARDEN_ORG_NAME: ${VAULTWARDEN_ORG_NAME:-Armazem Galdino}
      EVOLUTION_API_BASE_URL: ${EVOLUTION_API_BASE_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_API_INSTANCE: ${EVOLUTION_API_INSTANCE:-}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN:-}
      OPENAI_TRANSCRIPTION_API_URL: ${OPENAI_TRANSCRIPTION_API_URL:-http://whisper:9000/asr}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-small}
      OPENAI_TRANSCRIPTION_LANGUAGE: ${OPENAI_TRANSCRIPTION_LANGUAGE:-pt}
    expose:
      - "8080"
    volumes:
      - /home/galdino/.hermes:/home/galdino/.hermes
    networks:
      - nexusit-internal
      - vps_proxy
      - zabbix_zabbix-internal
  nexusit-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: nexusit-frontend
    restart: unless-stopped
    depends_on:
      - nexusit-backend
    expose:
      - "80"
    networks:
      - nexusit-internal
      - vps_proxy

networks:
  nexusit-internal:
    driver: bridge
  vps_proxy:
    external: true
  zabbix_zabbix-internal:
    external: true
