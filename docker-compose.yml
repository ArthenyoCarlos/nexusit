services:
  nexusit-db:
    image: postgres:16
    container_name: nexusit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nexusit}
      POSTGRES_USER: ${DB_USER:-nexusit}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /opt/data/nexusit/postgres:/var/lib/postgresql/data
    networks:
      - nexusit-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nexusit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nexusit-backend:
    build: ./backend
    container_name: nexusit-backend
    restart: unless-stopped
    depends_on:
      nexusit-db:
        condition: service_healthy
    environment:
      DB_HOST: nexusit-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-nexusit}
      DB_USER: ${DB_USER:-nexusit}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-28800000}
      ZABBIX_API_URL: ${ZABBIX_API_URL}
      ZABBIX_USER: ${ZABBIX_USER:-Admin}
      ZABBIX_PASSWORD: ${ZABBIX_PASSWORD}
      GLPI_API_URL: ${GLPI_API_URL}
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN:-}
      GLPI_USER_TOKEN: ${GLPI_USER_TOKEN:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://nexus.local}
      APP_COMPANY_NAME: ${APP_COMPANY_NAME:-Armazém Galdino}
      APP_SUPPORT_PHONE: ${APP_SUPPORT_PHONE:-}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY}
      VAULTWARDEN_BASE_URL: ${VAULTWARDEN_BASE_URL:-}
      VAULTWARDEN_EMAIL: ${VAULTWARDEN_EMAIL:-}
      VAULTWARDEN_MASTER_PASSWORD: ${VAULTWARDEN_MASTER_PASSWORD:-}
      VAULTWARDEN_ORG_NAME: ${VAULTWARDEN_ORG_NAME:-Armazem Galdino}
      EVOLUTION_API_BASE_URL: ${EVOLUTION_API_BASE_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_API_INSTANCE: ${EVOLUTION_API_INSTANCE:-}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN:-}
      OPENAI_TRANSCRIPTION_API_URL: ${OPENAI_TRANSCRIPTION_API_URL:-http://whisper:9000/asr}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-small}
      OPENAI_TRANSCRIPTION_LANGUAGE: ${OPENAI_TRANSCRIPTION_LANGUAGE:-pt}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-/run/secrets/firebase-service-account.json}
      UPDATER_URL: ${UPDATER_URL:-http://nexusupdater:9000}
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
    expose:
      - "8080"
    volumes:
      - /home/galdino/.hermes:/home/galdino/.hermes
      - /home/galdino/.secrets/nexusit/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    networks:
      - nexusit-internal
      - vps_proxy
      - zabbix_zabbix-internal
  nexusit-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: nexusit-frontend
    restart: unless-stopped
    depends_on:
      - nexusit-backend
    expose:
      - "80"
    networks:
      - nexusit-internal
      - vps_proxy

  # NexusDesk (acesso remoto) — servidor RustDesk self-hospedado.
  # Falam TCP/UDP cru (não é HTTP), então não dá pra passar pelo nginx/vps_proxy
  # como o resto — as portas precisam ser publicadas direto no host da VM.
  nexusdesk-hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: nexusdesk-hbbs
    restart: unless-stopped
    command: hbbs -r ${NEXUSDESK_RELAY_HOST:-nexus.local}:21117
    ports:
      - "21115:21115"
      - "21116:21116/tcp"
      - "21116:21116/udp"
      - "21118:21118"
    volumes:
      - /opt/data/nexusdesk:/root
    networks:
      - nexusit-internal
    depends_on:
      - nexusdesk-hbbr

  nexusdesk-hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: nexusdesk-hbbr
    restart: unless-stopped
    command: hbbr
    ports:
      - "21117:21117"
      - "21119:21119"
    volumes:
      - /opt/data/nexusdesk:/root
    networks:
      - nexusit-internal

  # NexusUpdater — servico auxiliar separado que verifica e aplica atualizacoes
  # (git pull + docker compose rebuild). Fica fora do container do backend de proposito:
  # so ele tem acesso ao socket do Docker e ao checkout real do repo no host.
  nexusupdater:
    build: ./nexusupdater
    container_name: nexusupdater
    restart: unless-stopped
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      REPO_PATH: ${NEXUSIT_REPO_PATH:-/opt/nexusit}
      COMPOSE_ENV_FILE: /opt/env/nexusit/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/env/nexusit/.env:/opt/env/nexusit/.env:ro
      - ${NEXUSIT_REPO_PATH:-/opt/nexusit}:${NEXUSIT_REPO_PATH:-/opt/nexusit}
    expose:
      - "9000"
    networks:
      - nexusit-internal

networks:
  nexusit-internal:
    driver: bridge
  vps_proxy:
    external: true
  zabbix_zabbix-internal:
    external: true
